<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eee7dc">
  <title>ねこのへや</title>
  <meta name="description" content="ねこがすごすへやを、のんびりながめるゲーム。">
  <meta property="og:title" content="ねこのへや">
  <meta property="og:description" content="ねこがすごすへやを、のんびりながめるゲーム。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="ねこのへや">
  <meta property="og:image" content="https://monnouchi.github.io/cat-room/assets/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ねこと、まどのあるへや">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ねこのへや">
  <meta name="twitter:description" content="ねこがすごすへやを、のんびりながめるゲーム。">
  <meta name="twitter:image" content="https://monnouchi.github.io/cat-room/assets/ogp.png">
  <meta name="twitter:image:alt" content="ねこと、まどのあるへや">
  <link rel="canonical" href="https://monnouchi.github.io/cat-room/">
  <meta property="og:url" content="https://monnouchi.github.io/cat-room/">
  <link rel="preload" href="assets/fonts/neko-room-maru.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>ねこのへや</h1>
      <div class="header-actions">
        <button id="mute" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 5L5 9H2v6h3l5 4V5zm4 3a6 6 0 010 8"/></svg><span data-label>おとをけす</span></button>
        <div class="settings">
          <button id="settings-button" aria-label="せってい" aria-expanded="false" aria-controls="settings-panel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10l2 2M5 19l2-2M17 7l2-2"/></svg><span>せってい</span></button>
          <div id="settings-panel" hidden><label><input id="show-text" type="checkbox" checked>ぶんをみせる</label></div>
        </div>
      </div>
    </header>
    <section class="camera" aria-label="ねこがすごすへや">
      <canvas id="room" width="960" height="640" aria-label="ねこが、ひのはいるへやでのんびりすごしています"></canvas>
      
      <div id="narration-status" class="camera-bottom"><span id="activity">すやすや、おひるね。</span></div>
    </section>
    <div class="below-camera">
      <div id="narration-greeting" class="moments">
        <p id="welcome"></p>
        
      </div>
      <div class="actions"><button id="sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 5L5 9H2v6h3l5 4V5zm4 3a6 6 0 010 8m3-11a10 10 0 010 14"/></svg><span>おとをならす</span></button><button id="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 12h18l-2 7H5l-2-7zm4-4h10M9 5h6"/></svg><span>ごはん</span></button><button id="light" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 16c0-3-3-4-3-7a7 7 0 0114 0c0 3-3 4-3 7zM9 19h6m-5 3h4"/></svg><span>でんき</span></button><button id="capture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="2" y="6" width="20" height="15" rx="3"/><path d="M7 6l2-3h6l2 3"/><circle cx="12" cy="13" r="4"/></svg><span>しゃしん</span></button></div>
    </div>
  </main>
  <dialog id="photo-dialog" aria-label="とったしゃしん">
    <button id="photo-close" aria-label="とじる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>とじる</span></button>
    <img id="photo-preview" alt="ねことへやのしゃしん">
    <div class="photo-actions"><button id="photo-save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v12m-5-5l5 5 5-5M4 16v5h16v-5"/></svg><span>ほぞん</span></button><button id="photo-share" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 16V3m-5 5l5-5 5 5M4 12v9h16v-9"/></svg><span>おくる</span></button></div>
    <p id="photo-status" role="status"></p>
  </dialog>
  <script type="module" src="app.js"></script>
  <script type="module" src="capture.js"></script>
</body>
</html>
